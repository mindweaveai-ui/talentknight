<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentKnight — Vesper-matched candidates, ready when you are</title>
<meta name="description" content="See TalentKnight's Vesper AI matching engine in action. Describe a role in plain English and get a ranked shortlist of pre-vetted candidates in seconds.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.talentknight.ai/demo.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f8fafc;
    --surface: #f1f5f9;
    --surface-raised: #e2e8f0;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --gold: #2563eb;
    --gold-bright: #3b82f6;
    --gold-dim: #1d4ed8;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
    --sage: #10b981;
    --amber: #f59e0b;
    --rose: #ef4444;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
    --serif: 'Inter', -apple-system, sans-serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(37, 99, 235, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(37, 99, 235, 0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ============ NAVIGATION ============ */
  nav {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 48px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
  }

  .brand {
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--gold);
  }

  .brand-mark svg {
    width: 18px;
    height: 18px;
    fill: #ffffff;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .brand-name .k-accent { color: var(--gold); }

  .brand-tag {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .scenario-indicator {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: rgba(37, 99, 235, 0.04);
  }

  .scenario-indicator .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 8px var(--gold);
  }

  .vesper-indicator {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--sage);
    padding: 6px 14px;
    border: 1px solid rgba(138, 166, 131, 0.25);
    border-radius: 2px;
    background: rgba(138, 166, 131, 0.05);
    display: none;
  }

  .vesper-indicator .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sage);
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 2s ease-in-out infinite;
  }

  .admin-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    border-radius: 2px;
  }

  .admin-toggle:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(37, 99, 235, 0.06);
  }

  /* ============ LAYOUT ============ */
  main {
    position: relative;
    z-index: 5;
    min-height: calc(100vh - 91px);
    padding: 0 48px;
  }

  .view { display: none; animation: fadeIn 0.6s ease; }
  .view.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ SCREEN 1: BRIEF INPUT ============ */
  #screen-brief {
    max-width: 780px;
    margin: 0 auto;
    padding: 100px 0 60px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .eyebrow::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  h1.headline {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(40px, 5vw, 58px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    color: var(--text);
  }

  h1.headline em {
    font-style: italic;
    color: var(--gold);
    font-weight: 400;
  }

  .sub {
    font-size: 17px;
    color: var(--text-muted);
    max-width: 560px;
    margin-bottom: 56px;
    line-height: 1.7;
  }

  .brief-field {
    position: relative;
    margin-bottom: 28px;
  }

  .brief-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  textarea#briefInput {
    width: 100%;
    min-height: 160px;
    padding: 24px 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.5;
    resize: vertical;
    transition: all 0.25s ease;
    outline: none;
  }

  textarea#briefInput::placeholder {
    color: var(--text-dim);
    font-style: italic;
  }

  textarea#briefInput:focus {
    border-color: var(--gold);
    background: var(--surface-raised);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12), 0 4px 12px rgba(0,0,0,0.06);
  }

  .brief-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 40px;
  }

  button.primary {
    background: var(--gold);
    border: none;
    color: #ffffff;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0;
    padding: 16px 36px;
    cursor: pointer;
    border-radius: 999px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  button.primary:hover {
    background: var(--gold-dim);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
  }

  button.primary:active { transform: translateY(0); }

  .brief-hint {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .brief-hint kbd {
    background: rgba(37, 99, 235, 0.06);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ============ SCREEN 2: LOADING ============ */
  #screen-loading {
    max-width: 540px;
    margin: 0 auto;
    padding: 160px 0;
    text-align: center;
  }

  .loader-mark {
    width: 60px;
    height: 60px;
    margin: 0 auto 48px;
    position: relative;
  }

  .loader-mark svg {
    width: 100%;
    height: 100%;
    animation: slowSpin 3s linear infinite;
  }

  @keyframes slowSpin {
    to { transform: rotate(360deg); }
  }

  .loader-stages {
    list-style: none;
    text-align: left;
    max-width: 380px;
    margin: 0 auto;
  }

  .loader-stages li {
    padding: 14px 0;
    font-size: 15px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0.3;
    transition: all 0.5s ease;
  }

  .loader-stages li.active {
    opacity: 1;
    color: var(--text);
  }

  .loader-stages li.done {
    opacity: 0.7;
    color: var(--text-muted);
  }

  .stage-marker {
    width: 20px;
    height: 20px;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .loader-stages li.active .stage-marker::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .loader-stages li.done .stage-marker {
    background: var(--gold);
    border-color: var(--gold);
  }

  .loader-stages li.done .stage-marker::after {
    content: '';
    width: 8px;
    height: 4px;
    border-left: 1.5px solid #ffffff;
    border-bottom: 1.5px solid #ffffff;
    transform: rotate(-45deg) translate(1px, -1px);
  }

  /* ============ SCREEN 3: RESULTS ============ */
  #screen-results {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 0 100px;
  }

  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 48px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .results-title {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .results-title em {
    font-style: italic;
    color: var(--gold);
  }

  .results-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-top: 10px;
  }

  .results-subtitle .ai-badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    border: 1px solid rgba(138, 166, 131, 0.3);
    padding: 2px 8px;
    border-radius: 2px;
    margin-left: 10px;
    vertical-align: middle;
  }

  .new-search {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.25s ease;
  }

  .new-search:hover { border-color: var(--gold); color: var(--gold); }

  .candidates-grid {
    display: grid;
    gap: 20px;
  }

  .candidate {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 28px;
    align-items: start;
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(12px);
    animation: slideIn 0.5s ease forwards;
    position: relative;
    overflow: hidden;
  }

  .candidate::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--gold);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.4s ease;
  }

  .candidate:hover {
    border-color: var(--border-strong);
    background: var(--surface-raised);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .candidate:hover::before { transform: scaleY(1); }

  @keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .candidate:nth-child(1) { animation-delay: 0.1s; }
  .candidate:nth-child(2) { animation-delay: 0.2s; }
  .candidate:nth-child(3) { animation-delay: 0.3s; }
  .candidate:nth-child(4) { animation-delay: 0.4s; }
  .candidate:nth-child(5) { animation-delay: 0.5s; }

  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(37, 99, 235, 0.04));
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--gold);
    letter-spacing: 0.02em;
  }

  .candidate-body { min-width: 0; }

  .candidate-name {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--text);
  }

  .candidate-headline {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }

  .candidate-why {
    font-style: italic;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.65;
    max-width: 580px;
  }

  .candidate-why::before {
    content: '"';
    color: var(--gold);
    font-size: 22px;
    margin-right: 2px;
    opacity: 0.6;
  }

  .candidate-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
    min-width: 180px;
  }

  .fit-score {
    text-align: right;
  }

  .fit-score-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .fit-score-value {
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 500;
    line-height: 1;
    color: var(--gold);
  }

  .fit-score-value .max {
    font-size: 14px;
    color: var(--text-dim);
    margin-left: 2px;
  }

  .fit-bar {
    width: 140px;
    height: 3px;
    background: rgba(37, 99, 235, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .fit-bar-fill {
    height: 100%;
    background: var(--gold);
    width: 0;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
  }

  .fit-bar-fill.sage { background: var(--sage); }
  .fit-bar-fill.amber { background: var(--amber); }

  .candidate-actions {
    display: flex;
    gap: 10px;
  }

  .btn-interest, .btn-pass {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s ease;
    font-weight: 500;
  }

  .btn-interest {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #ffffff;
  }

  .btn-interest:hover {
    background: var(--gold-bright);
    border-color: var(--gold-bright);
  }

  .btn-pass {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .btn-pass:hover {
    border-color: var(--text-muted);
    color: var(--text-muted);
  }

  .btn-linkedin {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-linkedin svg {
    width: 13px; height: 13px;
    flex-shrink: 0; opacity: 0.6;
    fill: currentColor;
  }
  .btn-linkedin:hover {
    border-color: #0a66c2;
    color: #5ba4f5;
  }
  .btn-linkedin:hover svg { opacity: 1; }

  .candidate.interested {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.06), rgba(37, 99, 235, 0.01));
  }

  .interest-confirm {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold);
    font-size: 15px;
    display: none;
  }

  .candidate.interested .interest-confirm { display: block; }
  .candidate.interested .candidate-actions { display: none; }
  .candidate.passed { opacity: 0.35; }

  .candidate-snapshot {
    grid-column: 1 / -1;
    margin-top: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .snapshot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .snapshot-field { display: flex; flex-direction: column; gap: 2px; }

  .snapshot-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .snapshot-value { font-size: 13px; font-weight: 500; color: var(--text); }

  .snapshot-loading .snapshot-value { color: var(--text-dim); font-weight: 400; font-style: italic; }

  .btn-details {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 2px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-details:hover { border-color: var(--gold); color: var(--gold); }

  /* ============ ENRICHING INDICATOR ============ */
  .enriching-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .enriching-indicator.active { display: flex; }

  .enriching-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.2s ease-in-out infinite;
  }

  /* ============ ERROR STATE ============ */
  .error-notice {
    background: rgba(184, 122, 111, 0.08);
    border: 1px solid rgba(184, 122, 111, 0.2);
    border-radius: 3px;
    padding: 14px 20px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
    display: none;
  }

  /* ============ FALLBACK / EMPTY STATE ============ */
  .fallback-state {
    max-width: 600px;
    margin: 80px auto;
    text-align: center;
    padding: 60px 40px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
  }

  .fallback-state .crest {
    width: 48px;
    height: 48px;
    margin: 0 auto 24px;
    opacity: 0.6;
  }

  .fallback-state h3 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 16px;
  }

  .fallback-state p {
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 28px;
  }

  /* ============ ADMIN VIEW ============ */
  #admin-view {
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 0 100px;
  }

  .admin-header {
    margin-bottom: 48px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }

  .admin-header h2 {
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .admin-header h2 em {
    font-style: italic;
    color: var(--gold);
  }

  .admin-header p {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 600px;
  }

  .admin-notice {
    background: rgba(138, 166, 131, 0.08);
    border: 1px solid rgba(138, 166, 131, 0.2);
    border-radius: 3px;
    padding: 16px 20px;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 40px;
    line-height: 1.6;
  }

  .admin-notice strong {
    color: var(--sage);
    font-weight: 600;
  }

  .admin-section {
    margin-bottom: 56px;
  }

  .admin-section-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .admin-section-desc {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .active-scenario-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .active-scenario-row label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }

  select.scenario-select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 2px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  select.scenario-select:focus, select.scenario-select:hover {
    border-color: var(--gold);
  }

  .scenarios-list {
    display: grid;
    gap: 14px;
  }

  .scenario-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 24px 28px;
  }

  .scenario-card-head {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 16px;
    gap: 20px;
  }

  .scenario-card-title {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
  }

  .scenario-card-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .keyword {
    font-size: 11px;
    padding: 4px 10px;
    background: rgba(37, 99, 235, 0.06);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .scenario-card-actions {
    display: flex;
    gap: 10px;
  }

  .btn-small {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 8px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }

  .btn-small:hover { border-color: var(--gold); color: var(--gold); }
  .btn-small.danger:hover { border-color: var(--rose); color: var(--rose); }

  .btn-add {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--accent, var(--gold));
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 18px 24px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.25s;
    width: 100%;
    margin-top: 14px;
  }

  .btn-add:hover {
    border-color: var(--gold);
    background: rgba(37, 99, 235, 0.04);
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 20px;
    overflow-y: auto;
  }

  .modal-backdrop.active { display: flex; }

  .modal {
    background: var(--bg-soft);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    max-width: 760px;
    width: 100%;
    padding: 40px 44px;
    box-shadow: var(--shadow);
  }

  .modal h3 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .modal-desc {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .field input, .field textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus, .field textarea:focus { border-color: var(--gold); }

  .field textarea { min-height: 70px; resize: vertical; font-family: var(--sans); font-size: 15px; }

  .field-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .candidate-editor {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
  }

  .candidate-editor-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .candidate-editor-title {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .remove-candidate {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .remove-candidate:hover { color: var(--rose); }

  .cand-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 120px;
    gap: 12px;
    margin-bottom: 12px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 12px 24px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

  /* ============ CV UPLOAD ============ */
  .cv-upload-section {
    display: none;
    margin: 40px 0 0;
    padding: 32px 36px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    animation: fadeUp 0.5s ease;
  }
  .cv-upload-section.visible { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .cv-upload-eyebrow {
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .cv-upload-heading {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .cv-upload-heading em { font-style: italic; color: var(--gold); }
  .cv-upload-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .cv-drop-zone {
    border: 1px dashed var(--border-strong);
    border-radius: 10px;
    padding: 32px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    background: rgba(37,99,235,0.02);
  }
  .cv-drop-zone:hover, .cv-drop-zone.dragover {
    border-color: var(--gold);
    background: rgba(37,99,235,0.04);
  }
  .cv-drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .cv-drop-icon {
    width: 36px; height: 36px;
    border: 1px solid var(--border-strong);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .cv-drop-icon svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 1.5; }
  .cv-drop-label { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .cv-drop-label strong { color: var(--gold); font-weight: 500; }
  .cv-drop-types { font-size: 11px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.06em; }
  .cv-uploading { display: none; text-align: center; padding: 20px 0 8px; font-size: 13px; color: var(--text-muted); }
  .cv-uploading.visible { display: block; }
  .cv-uploading-dots::after {
    content: '';
    animation: cvdots 1.2s steps(4, end) infinite;
  }
  @keyframes cvdots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
  .cv-error { display: none; margin-top: 12px; font-size: 12px; color: var(--rose); text-align: center; }
  .cv-error.visible { display: block; }
  .candidate.cv-upload-card {
    border-color: rgba(37,99,235,0.25);
    background: linear-gradient(135deg, rgba(37,99,235,0.04), rgba(37,99,235,0.01));
  }
  .cv-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(37,99,235,0.25);
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 6px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 780px) {
    nav { padding: 14px 20px; gap: 10px; }
    nav img[alt="TalentKnight"] { display: none; }
    .vesper-indicator { display: none !important; }
    .scenario-indicator { display: none; }
    .admin-toggle { padding: 8px 12px; font-size: 10px; }
    main { padding: 0 20px; }
    #screen-brief { padding: 48px 0 40px; }
    textarea#briefInput { font-size: 17px; padding: 18px 20px; }
    .brief-actions { flex-direction: column; align-items: flex-start; gap: 14px; }
    .brief-hint { display: none; }
    #screen-brief button.primary { width: 100%; padding: 18px 24px; text-align: center; }
    .results-header { flex-direction: column; align-items: flex-start; gap: 16px; }
    .results-title { font-size: 26px; }
    .candidate { grid-template-columns: 1fr; gap: 16px; padding: 20px; }
    .candidate-right { align-items: flex-start; min-width: 0; width: 100%; flex-direction: row; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .fit-bar { width: 100px; }
    .btn-interest, .btn-pass { padding: 12px 14px; flex: 1; text-align: center; }
    .contact-fields { grid-template-columns: 1fr; }
    .contact-submit { flex-direction: column; align-items: stretch; }
    .contact-submit button.primary { width: 100%; }
    .contact-confirm { flex-direction: column; gap: 16px; padding: 24px 20px; }
    .modal-backdrop { padding: 20px 12px; }
    .modal { padding: 24px 20px; }
    .modal h3 { font-size: 22px; }
    .cand-grid { grid-template-columns: 1fr; }
    .modal-actions { flex-direction: column-reverse; gap: 10px; }
    .modal-actions button { width: 100%; padding: 14px; }
    #admin-view { padding: 40px 0 60px; }
    .admin-header h2 { font-size: 28px; }
    .active-scenario-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .scenario-card { padding: 18px 16px; }
    .scenario-card-head { flex-direction: column; gap: 12px; }
    .scenario-card-actions { justify-content: flex-start; }
    .fallback-state { padding: 40px 20px; }
    #screen-loading { padding: 100px 0; }
  }

  /* ============ CONTACT FORM ============ */
  .contact-section {
    margin-top: 64px;
    padding-top: 60px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .contact-section.visible { display: block; }

  .contact-eyebrow {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .contact-eyebrow::before {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  .contact-heading {
    font-family: var(--serif);
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 500;
    line-height: 1.1;
    margin-bottom: 16px;
  }

  .contact-heading em { font-style: italic; color: var(--gold); font-weight: 400; }

  .contact-sub {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 520px;
    line-height: 1.7;
    margin-bottom: 44px;
  }

  .contact-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
    max-width: 680px;
  }

  .cf-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .cf-field .optional {
    font-size: 10px;
    opacity: 0.6;
    text-transform: lowercase;
    letter-spacing: 0;
  }

  .cf-field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
  }

  .cf-field input:focus {
    border-color: var(--gold);
    background: var(--bg);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
  }

  .cf-field input::placeholder { color: var(--text-dim); }

  .contact-submit {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .contact-confirm {
    display: none;
    align-items: center;
    gap: 28px;
    padding: 32px 36px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    max-width: 560px;
    animation: fadeIn 0.5s ease;
  }

  .contact-confirm.visible { display: flex; }

  .contact-confirm-text h4 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .contact-confirm-text p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .contact-confirm-text strong { color: var(--text); }

  /* ============ LEAD CARDS (Admin) ============ */
  .lead-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 20px 24px;
    margin-bottom: 12px;
    animation: fadeIn 0.4s ease;
  }

  .lead-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 16px;
  }

  .lead-name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
  }

  .lead-timestamp {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .lead-contact {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .lead-email { color: var(--gold); }

  .lead-brief {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    font-family: var(--serif);
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 4px;
    line-height: 1.5;
  }

  .leads-empty {
    color: var(--text-dim);
    font-style: italic;
    padding: 12px 0;
    font-size: 14px;
  }

  @media (max-width: 780px) {
    .contact-fields { grid-template-columns: 1fr; }
    .contact-submit { flex-direction: column; align-items: flex-start; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

  .brand img { display: none !important; }
  .brand::before { content: 'Talent'; font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; font-family: var(--sans); }
  .brand::after  { content: 'Knight'; font-size: 20px; font-weight: 700; color: #2563eb; letter-spacing: -0.02em; font-family: var(--sans); }
.view-switcher{display:flex;gap:6px;}.view-btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;transition:all 0.2s ease;}.view-btn:hover{border-color:var(--border-strong);}.view-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(37,99,235,0.06);}.view-note{font-size:12px;color:var(--text-muted);line-height:1.7;margin:16px 0 0;padding:12px 16px;background:var(--surface);border-left:2px solid var(--gold);border-radius:0 4px 4px 0;}.view-note strong{color:var(--text);}</style>
