<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentKnight — Client Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script

    crossorigin="anonymous"

    type="text/javascript"
  ></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --dim: #94a3b8;
      --green: #16a34a;
      --amber: #d97706;
      --rose: #ef4444;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    .nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 58px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 200;
    }
    .nav-logo { font-size: 17px; font-weight: 700; color: var(--blue); letter-spacing: -0.5px; }
    .nav-logo span { color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-client { font-size: 13px; color: var(--muted); font-weight: 500; }
    .signout-btn {
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
      background: none; border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 11px; cursor: pointer; transition: background 0.12s;
    }
    .signout-btn:hover { background: var(--bg); }

    /* ── PAGE HEADER ── */
    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); }
    .header-inner { padding: 18px 28px 0; }
    .page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }

    /* ── APP LAYOUT (sidebar + content) ── */
    .app-layout { display: flex; height: calc(100vh - 58px); overflow: hidden; }
    .sidebar {
      width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-top { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .sidebar-company-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .sidebar-select-label {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--muted); margin: 0 0 4px;
    }
    .company-select {
      font-family: inherit; font-size: 13px; font-weight: 600; width: 100%;
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .company-select:focus { outline: none; border-color: var(--blue); }
    .client-record-link {
      font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--blue);
      background: none; border: none; padding: 6px 0 0; cursor: pointer; text-align: left;
      display: block;
    }
    .client-record-link:hover { text-decoration: underline; }
    .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .role-search-input {
      font-family: inherit; font-size: 12px; width: 100%;
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text); transition: border-color 0.12s;
    }
    .role-search-input:focus { outline: none; border-color: var(--blue); background: var(--surface); }
    .role-search-input::placeholder { color: var(--dim); }
    .role-list { flex: 1; overflow-y: auto; padding: 6px; }
    .role-list-empty { padding: 20px 10px; text-align: center; color: var(--dim); font-size: 12px; }
    .role-item {
      padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
      border-left: 3px solid transparent; transition: background 0.12s;
    }
    .role-item:hover { background: var(--bg); }
    .role-item.active { background: var(--blue-light); border-left-color: var(--blue); }
    .role-item-top { display: flex; align-items: center; gap: 7px; }
    .role-item-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .role-item-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .role-item.active .role-item-title { color: var(--blue); }
    .role-item-meta {
      font-size: 11px; color: var(--muted); margin-top: 2px; padding-left: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .new-role-btn-sidebar {
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--blue);
      background: var(--blue-light); border: none; border-top: 1px solid var(--border);
      padding: 11px; cursor: pointer; transition: background 0.12s; flex-shrink: 0;
    }
    .new-role-btn-sidebar:hover { background: #dbeafe; }

    .content-area { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 24px 60px; }
    .content-header { margin-bottom: 4px; }

    /* ── ROLE INFO BAR ── */
    .role-info {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap;
    }
    .status-badge {
      font-size: 11px; font-weight: 600; padding: 2px 9px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .status-active   { background: #dcfce7; color: #166534; }
    .status-paused   { background: #fef9c3; color: #854d0e; }
    .status-filled   { background: #dbeafe; color: #1e40af; }
    .status-closed   { background: #f1f5f9; color: #475569; }
    .role-brief { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
    .find-matches-btn {
      font-family: inherit; font-size: 11px; font-weight: 600; color: var(--blue);
      background: var(--blue-light); border: 1px solid #bfdbfe; border-radius: 20px;
      padding: 3px 10px; cursor: pointer; transition: background 0.12s;
    }
    .find-matches-btn:hover { background: #dbeafe; }
    .find-matches-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .find-matches-status { font-size: 11px; color: var(--muted); }
    .role-icon-btn {
      font-family: inherit; font-size: 12px; color: var(--muted);
      background: transparent; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: 3px 7px; cursor: pointer; transition: background 0.12s, color 0.12s;
    }
    .role-icon-btn:hover { background: var(--bg); color: var(--dim); }
    .role-icon-btn.danger:hover { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
    .show-closed-toggle {
      display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted);
      padding: 4px 4px 8px; cursor: pointer; user-select: none;
    }
    .show-closed-toggle input { margin: 0; }

    /* ── SEARCH BAR (candidates) ── */
    .search-row { display: flex; align-items: center; gap: 10px; padding: 0 0 12px; }
    .search-wrap { position: relative; flex: 1; max-width: 340px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 13px; pointer-events: none; }
    .search-input {
      font-family: inherit; font-size: 13px; width: 100%;
      padding: 8px 32px 8px 32px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .search-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
    .search-input::placeholder { color: var(--dim); }
    .search-clear {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: var(--dim); cursor: pointer; display: none;
      background: none; border: none; padding: 2px 4px; line-height: 1;
    }
    .search-clear:hover { color: var(--text); }
    .search-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* ── KANBAN ── */
    .kanban-outer { }
    .kanban-board { display: flex; gap: 8px; align-items: flex-start; width: 100%; }
    .kanban-col {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      border-radius: 10px; background: #eef2f7; border: 1px solid #dde3ec; overflow: hidden;
    }
    .col-header {
      display: flex; align-items: center; gap: 7px; padding: 10px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stage-name {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stage-count {
      font-size: 11px; font-weight: 600; color: var(--muted);
      background: var(--bg); padding: 1px 6px; border-radius: 10px; flex-shrink: 0;
    }
    .col-body {
      padding: 7px; min-height: 180px; display: flex; flex-direction: column;
      gap: 6px; transition: background 0.12s;
    }
    .col-body.drag-over {
      background: #dbeafe; outline: 2px dashed var(--blue);
      outline-offset: -3px; border-radius: 0 0 10px 10px;
    }
    .col-empty { padding: 20px 8px; text-align: center; color: var(--dim); font-size: 11px; }

    /* ── CANDIDATE CARDS ── */
    .cand-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px; cursor: pointer;
      transition: box-shadow 0.12s, transform 0.12s, opacity 0.12s;
    }
    .cand-card:hover { box-shadow: 0 3px 10px rgba(15,23,42,0.1); transform: translateY(-1px); }
    .cand-card.dragging { opacity: 0.35; cursor: grabbing; }
    .card-top { display: flex; align-items: flex-start; gap: 8px; }
    .cand-avatar {
      width: 30px; height: 30px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 11px;
      font-weight: 700; color: white; flex-shrink: 0; position: relative; overflow: hidden;
    }
    .card-body { flex: 1; min-width: 0; }
    .cand-name { font-size: 12px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
    /* AI Candidate Summaries (2026-08-05) — one-line "why they fit" from rankPoolAgainstRole,
       shown on the card so recruiters don't have to open every profile. Styled distinctly
       from .cand-sub (italic, blue-tinted) so it reads as "AI's take" not raw profile data. */
    .cand-ai-summary {
      font-size: 11px; color: #4c6ef5; font-style: italic; margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); gap: 4px;
    }
    .card-loc { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .stage-age {
      font-size: 10px; font-weight: 700; padding: 1px 5px;
      border-radius: 4px; white-space: nowrap; flex-shrink: 0;
    }
    .stage-age-ok     { background: #f1f5f9; color: var(--muted); }
    .stage-age-warn   { background: #fef3c7; color: var(--amber); }
    .stage-age-alert  { background: #fee2e2; color: var(--rose); }
    .card-icons { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .li-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 3px; background: #0a66c2;
      color: white; font-size: 9px; font-weight: 800; text-decoration: none;
    }
    .consent-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
    .consent-dot.ok { background: var(--green); }

    /* ── DEAL TERMS (earnings) ── */
    .deal-terms { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
    .deal-input {
      font-family: inherit; font-size: 12px; width: 54px; text-align: right;
      padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--text); transition: border-color 0.12s;
    }
    .deal-input:focus { outline: none; border-color: var(--blue); }
    .deal-input.salary { width: 78px; }
    /* Hide native number-input spinner arrows — fiddly to use for typing a figure
       directly, per feedback 2026-08-05. Applies to Fee %, Target/Salary, and the
       drawer's Placement salary field, since they all share .deal-input. */
    .deal-input::-webkit-outer-spin-button, .deal-input::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .deal-input[type=number] { -moz-appearance: textfield; }
    .deal-save-status { font-size: 11px; color: var(--green); opacity: 0; transition: opacity 0.3s; }
    .forecast-pill {
      font-size: 11px; font-weight: 600; color: #6d28d9; background: #f5f3ff;
      border: 1px solid #ddd6fe; border-radius: 20px; padding: 2px 9px;
    }

    /* ── EARNINGS VIEW ── */
    .earnings-toggle-btn {
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--blue);
      background: none; border: none; border-top: 1px solid var(--border);
      padding: 9px 11px; cursor: pointer; transition: background 0.12s; flex-shrink: 0;
      text-align: left;
    }
    .earnings-toggle-btn:hover { background: var(--bg); }
    .earnings-summary { display: flex; gap: 12px; margin: 4px 0 20px; flex-wrap: wrap; }
    .earnings-card {
      flex: 1; min-width: 180px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
    }
    .earnings-card-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--dim); }
    .earnings-card-value { font-size: 24px; font-weight: 700; margin-top: 4px; letter-spacing: -0.4px; }
    .earnings-card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .earnings-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .earnings-table th {
      text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--dim); padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--border);
    }
    .earnings-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .earnings-table tr:last-child td { border-bottom: none; }
    .earnings-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .earnings-empty-note { font-size: 12px; color: var(--dim); padding: 20px; text-align: center; }

    /* ── FIT SCORE ── */
    .fit-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 20px; padding: 0 6px; border-radius: 10px;
      font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    /* Four-tier scheme (2026-08-05, replacing a two-cutoff good/ok/low scheme) — matches
       Mike's own bands: 90+ Excellent, 80-89 Strong, 70-79 Good, below 70 Partial. Class
       names use his exact words so fitScoreClass()'s output can double as the label text. */
    .fit-badge.excellent { background: #dcfce7; color: #166534; }
    .fit-badge.strong    { background: #cffafe; color: #0e7490; }
    .fit-badge.good      { background: #fef3c7; color: #92400e; }
    .fit-badge.partial   { background: #fee2e2; color: #b91c1c; }
    .fit-score-row { display: flex; align-items: center; gap: 10px; }
    .fit-score-num { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .fit-score-num .fit-score-max { font-size: 12px; font-weight: 500; color: var(--dim); }
    .fit-score-label { font-size: 12px; font-weight: 600; }
    .fit-score-label.excellent { color: #166534; }
    .fit-score-label.strong    { color: #0e7490; }
    .fit-score-label.good      { color: #92400e; }
    .fit-score-label.partial   { color: #b91c1c; }
    .fit-score-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
    .fit-score-bar-fill { height: 100%; border-radius: 3px; }
    .fit-score-bar-fill.excellent { background: var(--green); }
    .fit-score-bar-fill.strong    { background: #0891b2; }
    .fit-score-bar-fill.good      { background: var(--amber); }
    .fit-score-bar-fill.partial   { background: var(--rose); }

    /* ── CRM INTELLIGENCE (Contact History) ── added 2026-08-05 */
    .history-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .history-type-select {
      font-family: inherit; font-size: 12px; padding: 7px 8px; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg); color: var(--text); flex-shrink: 0;
    }
    .history-summary-input {
      font-family: inherit; font-size: 12px; flex: 1; min-width: 0;
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
      background: var(--bg); color: var(--text);
    }
    .history-summary-input:focus, .history-type-select:focus { outline: none; border-color: var(--blue); background: var(--surface); }
    .history-log-btn {
      font-family: inherit; font-size: 12px; font-weight: 600; color: white;
      background: var(--blue); border: none; border-radius: 7px; padding: 0 12px;
      cursor: pointer; flex-shrink: 0; transition: background 0.12s;
    }
    .history-log-btn:hover { background: #1d4ed8; }
    .history-log-btn:disabled { background: var(--dim); cursor: not-allowed; }
    .history-list { display: flex; flex-direction: column; }
    .history-entry { font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .history-entry:last-child { border-bottom: none; padding-bottom: 0; }
    .history-type-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--blue); background: var(--blue-light); border-radius: 4px; padding: 1px 6px;
      margin-right: 6px;
    }
    .history-meta { color: var(--dim); font-size: 11px; margin-top: 2px; }
    .history-empty, .history-loading { color: var(--dim); font-size: 12px; padding: 4px 0; }

    /* ── VACANCY DASHBOARD (hiring manager / role notes / activity+similar panels) ── added 2026-08-05 */
    .hiring-manager-line, .role-notes-line {
      font-size: 12px; color: var(--muted); padding: 0 0 10px;
    }
    .hiring-manager-line a { color: var(--blue); text-decoration: none; }
    .hiring-manager-line a:hover { text-decoration: underline; }
    .role-notes-line { color: var(--dim); font-style: italic; }
    .role-panel {
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
      padding: 14px 16px; margin-bottom: 14px;
    }
    .role-panel-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--muted); margin-bottom: 10px;
    }
    .role-panel-loading, .role-panel-empty { color: var(--dim); font-size: 12.5px; }
    .history-entry-who { font-weight: 600; color: var(--text); margin-right: 4px; }
    .similar-cand-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .similar-cand-row:last-child { border-bottom: none; padding-bottom: 0; }
    .similar-cand-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 11px; font-weight: 700;
    }
    .similar-cand-info { flex: 1; min-width: 0; }
    .similar-cand-name { font-size: 13px; font-weight: 600; }
    .similar-cand-score {
      font-size: 10.5px; font-weight: 700; color: var(--blue); background: var(--blue-light);
      border-radius: 4px; padding: 1px 5px; margin-left: 4px;
    }
    .similar-cand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
    .similar-cand-summary { font-size: 11px; color: #4c6ef5; font-style: italic; margin-top: 3px; }
    .similar-cand-linkedin { text-decoration: none; font-size: 14px; flex-shrink: 0; }

    /* ── AI RECRUITER ASSISTANT ── added 2026-08-05 */
    .assistant-search-row { display: flex; gap: 8px; margin-bottom: 18px; max-width: 640px; }
    .assistant-search-input {
      font-family: inherit; font-size: 13.5px; flex: 1; min-width: 0;
      padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--surface); color: var(--text); transition: border-color 0.12s, box-shadow 0.12s;
    }
    .assistant-search-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
    .assistant-search-input::placeholder { color: var(--dim); }
    .assistant-search-btn {
      font-family: inherit; font-size: 13px; font-weight: 600; color: white;
      background: var(--blue); border: none; border-radius: 9px; padding: 0 20px;
      cursor: pointer; transition: background 0.12s; flex-shrink: 0;
    }
    .assistant-search-btn:hover { background: #1d4ed8; }
    .assistant-search-btn:disabled { background: var(--dim); cursor: not-allowed; }
    .assistant-empty { color: var(--dim); font-size: 13px; padding: 20px 0; max-width: 480px; line-height: 1.6; }
    .assistant-results-list { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
    .assistant-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
      padding: 12px 14px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px;
      transition: box-shadow 0.12s, transform 0.12s;
    }
    .assistant-card:hover { box-shadow: 0 3px 10px rgba(15,23,42,0.1); transform: translateY(-1px); }

    /* ── RICH CLIENT RECORDS ── added 2026-08-05 */
    .client-back-btn {
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
      background: none; border: none; padding: 0 0 8px; cursor: pointer; display: block;
    }
    .client-back-btn:hover { color: var(--text); }
    .client-header-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 12px; max-width: 680px;
    }
    .client-header-top { display: flex; align-items: center; gap: 12px; }
    .client-avatar {
      width: 44px; height: 44px; border-radius: 10px; background: var(--blue); color: white;
      font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .client-name { font-size: 17px; font-weight: 700; color: var(--text); }
    .client-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; max-width: 680px; }
    .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .client-card-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--dim); margin-bottom: 8px;
    }
    .client-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; max-width: 680px; }
    .client-vacancy-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .client-vacancy-row:last-child { border-bottom: none; }
    .client-edit-toggle {
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--blue);
      background: none; border: none; cursor: pointer; margin-left: auto;
    }
    .client-edit-toggle:hover { text-decoration: underline; }
    .client-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .client-save-status { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; margin-left: 8px; }

    /* ── DRAWER ── */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.25); z-index: 300;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 400px;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 301; transform: translateX(100%);
      transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px; flex-shrink: 0;
    }
    .drawer-avatar {
      width: 46px; height: 46px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 16px;
      font-weight: 700; color: white; flex-shrink: 0; position: relative; overflow: hidden;
    }
    .drawer-name-block { flex: 1; min-width: 0; padding-top: 2px; }
    .drawer-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .drawer-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .drawer-close {
      width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 14px; color: var(--muted); flex-shrink: 0;
      transition: background 0.1s;
    }
    .drawer-close:hover { background: var(--bg); color: var(--text); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; }
    .drawer-section {}
    .drawer-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--dim); margin-bottom: 10px;
    }
    .drawer-detail-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text); margin-bottom: 7px;
    }
    .drawer-detail-row:last-child { margin-bottom: 0; }
    .drawer-detail-icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
    .drawer-stage-select {
      font-family: inherit; font-size: 13px; font-weight: 500;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); width: 100%; cursor: pointer; color: var(--text);
      transition: border-color 0.12s;
    }
    .drawer-stage-select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
    .stage-since {
      font-size: 12px; margin-top: 7px; padding: 6px 10px; border-radius: 7px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .stage-since-ok    { background: #f1f5f9; color: var(--muted); }
    .stage-since-warn  { background: #fef3c7; color: var(--amber); }
    .stage-since-alert { background: #fee2e2; color: var(--rose); }
    .drawer-notes {
      font-family: inherit; font-size: 13px; line-height: 1.6;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); width: 100%; resize: vertical; min-height: 110px;
      color: var(--text); transition: border-color 0.12s, background 0.12s;
    }
    .drawer-notes:focus { outline: none; border-color: var(--blue); background: var(--surface); box-shadow: 0 0 0 3px var(--blue-light); }
    .drawer-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .save-btn {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 9px 18px; background: var(--blue); color: white;
      border: none; border-radius: 8px; cursor: pointer; transition: background 0.12s;
    }
    .save-btn:hover { background: #1d4ed8; }
    .save-btn:disabled { background: var(--dim); cursor: not-allowed; }
    .save-status { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; }

    /* ── ROLE MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 400;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.18s; pointer-events: none;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 460px;
      border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(15,23,42,0.2);
      transform: translateY(10px); transition: transform 0.18s;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header {
      padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .modal-close {
      width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 13px; color: var(--muted); transition: background 0.1s;
    }
    .modal-close:hover { background: var(--bg); color: var(--text); }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .modal-field label {
      display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--dim); margin-bottom: 6px;
    }
    .modal-field label .req { color: var(--rose); margin-left: 2px; }
    .modal-input, .modal-textarea {
      font-family: inherit; font-size: 13px; width: 100%;
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); transition: border-color 0.12s, background 0.12s;
    }
    .modal-input:focus, .modal-textarea:focus {
      outline: none; border-color: var(--blue);
      background: var(--surface); box-shadow: 0 0 0 3px var(--blue-light);
    }
    .modal-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .modal-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    }
    .modal-cancel {
      font-family: inherit; font-size: 13px; font-weight: 500;
      padding: 8px 16px; background: var(--bg); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 0.1s;
    }
    .modal-cancel:hover { background: var(--border); color: var(--text); }
    .modal-submit {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 9px 18px; background: var(--blue); color: white;
      border: none; border-radius: 8px; cursor: pointer; transition: background 0.12s;
    }
    .modal-submit:hover { background: #1d4ed8; }
    .modal-submit:disabled { background: var(--dim); cursor: not-allowed; }

    /* ── STATES ── */
    .centered { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 14px; text-align: center; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-title { font-size: 17px; font-weight: 600; }
    .err-msg { color: var(--rose); font-size: 14px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">Talent<span>Knight</span></div>
  <div class="nav-right">
    <div class="nav-client" id="navClient"></div>
    <button class="signout-btn" id="signOutBtn" style="display:none;" onclick="Clerk.signOut()">Sign out</button>
  </div>
</nav>

<div id="main">
  <div class="centered">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:14px;">Loading your pipeline…</div>
  </div>
</div>

<!-- Candidate detail drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer">
    <button class="save-btn" id="saveBtn" onclick="saveNotes()">Save notes</button>
    <span class="save-status" id="saveStatus">✓ Saved</span>
  </div>
</div>

<!-- New role modal -->
<div class="modal-overlay" id="roleModalOverlay" onclick="closeRoleModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Request a new role</div>
      <button class="modal-close" onclick="closeRoleModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>Role title <span class="req">*</span></label>
        <input id="roleTitle" class="modal-input" type="text" placeholder="e.g. Senior Tax Manager" />
      </div>
      <div class="modal-field">
        <label>Location</label>
        <input id="roleLocation" class="modal-input" type="text" placeholder="e.g. London (Hybrid)" />
      </div>
      <div class="modal-field">
        <label>Brief / key requirements</label>
        <textarea id="roleBrief" class="modal-textarea" placeholder="Qualifications, years of experience, specialisms, salary range…"></textarea>
      </div>
      <div id="roleClarifyQuestions"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeRoleModal()">Cancel</button>
      <button class="modal-submit" id="roleSubmitBtn" onclick="submitNewRole()">Submit role</button>
    </div>
  </div>
</div>

<!-- Edit role modal -->
<div class="modal-overlay" id="editRoleModalOverlay" onclick="closeEditRoleModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Edit role</div>
      <button class="modal-close" onclick="closeEditRoleModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>Role title <span class="req">*</span></label>
        <input id="editRoleTitle" class="modal-input" type="text" />
      </div>
      <div class="modal-field">
        <label>Location</label>
        <input id="editRoleLocation" class="modal-input" type="text" />
      </div>
      <div class="modal-field">
        <label>Brief / key requirements</label>
        <textarea id="editRoleBrief" class="modal-textarea"></textarea>
      </div>
      <div class="modal-field">
        <label>Status</label>
        <select id="editRoleStatus" class="modal-input">
          <option value="Active">Active</option>
          <option value="Paused">Paused</option>
          <option value="Filled">Filled</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Hiring manager name</label>
        <input id="editRoleHMName" class="modal-input" type="text" />
      </div>
      <div class="modal-field">
        <label>Hiring manager email</label>
        <input id="editRoleHMEmail" class="modal-input" type="email" />
      </div>
      <div class="modal-field">
        <label>Hiring manager phone</label>
        <input id="editRoleHMPhone" class="modal-input" type="text" />
      </div>
      <div class="modal-field">
        <label>Role notes</label>
        <textarea id="editRoleNotes" class="modal-textarea" placeholder="General notes about this vacancy — separate from per-candidate notes."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="role-icon-btn danger" id="editRoleDeleteBtn" onclick="confirmDeleteRole()" style="margin-right:auto;">🗑️ Delete role</button>
      <button class="modal-cancel" onclick="closeEditRoleModal()">Cancel</button>
      <button class="modal-submit" id="editRoleSubmitBtn" onclick="submitEditRole()">Save changes</button>
    </div>
  </div>
</div>

<script>
let STAGES = ['Sourced','Contacted','Shortlisted','Interviewing','Offered','Placed','Rejected'];
const STAFF_STAGES = ['Matched','Sourced','Contacted','Shortlisted','Interviewing','Offered','Placed','Rejected'];
const CONTACT_STAGES = ['Sourced','Contacted','Shortlisted','Interviewing','Offered','Placed','Rejected'];
const STAGE_CFG = {
  Matched:      { dot: '#8b5cf6', color: '#6d28d9' },
  Sourced:      { dot: '#94a3b8', color: '#475569' },
  Contacted:    { dot: '#3b82f6', color: '#1d4ed8' },
  Shortlisted:  { dot: '#06b6d4', color: '#0e7490' },
  Interviewing: { dot: '#f59e0b', color: '#b45309' },
  Offered:      { dot: '#f97316', color: '#c2410c' },
  Placed:       { dot: '#22c55e', color: '#15803d' },
  Rejected:     { dot: '#ef4444', color: '#b91c1c' },
};

let state = null;
let orgIdx = 0;
let companyIdx = 0;
let roleIdx = 0;
let dragId = null;
let dragFrom = null;
let openCand = null;
let openCandRoleId = null; // CRM Intelligence — the Role in scope when the drawer was opened
let searchQuery = '';
let roleSearchQuery = '';
let showClosed = false; // hide Closed-status roles from the sidebar list by default
let editingRoleId = null;
let viewMode = 'pipeline'; // 'pipeline' | 'earnings' — earnings is staff-only

// ── Auth + load ─────────────────────────────────────────
async function authHeader() {
  const token = await Clerk.session.getToken();
  return { Authorization: `Bearer ${token}` };
}

async function load() {
  try {
    await Clerk.load();
  } catch {
    return showErr('Connection error', 'Could not reach the sign-in service — please refresh.');
  }

  if (!Clerk.user) {
    document.getElementById('main').innerHTML = `<div class="centered" style="min-height:80vh;"><div id="signIn"></div></div>`;
    Clerk.mountSignIn(document.getElementById('signIn'), {
      fallbackRedirectUrl: '/dashboard.html',
      signUpFallbackRedirectUrl: '/dashboard.html',
    });
    return;
  }

  document.getElementById('signOutBtn').style.display = 'inline-block';

  try {
    const h = await authHeader();
    const r = await fetch(`/api/crm?action=dashboard`, { headers: h });
    if (r.status === 401) return showErr('Session expired', 'Please sign in again.');
    if (r.status === 403) {
      const body = await r.json().catch(() => ({}));
      return showErr('No access yet', body.error || "Your account isn't linked to a company yet. Contact your admin.");
    }
    if (!r.ok) return showErr('Something went wrong', 'Please try refreshing the page.');
    state = await r.json();
  } catch { return showErr('Connection error', 'Please check your connection and refresh.'); }

  // Staff (recruiters) get a "Matched" column ahead of Sourced — this is where Vesper's
  // AI matches land for review before a human promotes them. Company Contacts never see it.
  STAGES = state.user?.isStaff ? STAFF_STAGES : CONTACT_STAGES;

  render();
}

// ── Render ────────────────────────────────────────────────
function currentCompany() {
  return state.organizations[orgIdx]?.companies[companyIdx];
}

function render() {
  const { user, organizations } = state;
  const main = document.getElementById('main');

  if (!organizations.length) {
    document.getElementById('navClient').textContent = user.name;
    document.title = 'TalentKnight';
    main.innerHTML = `
      <div class="centered" style="min-height:70vh;">
        <div style="font-size:36px;">📋</div>
        <div style="font-size:16px;font-weight:600;">No companies yet</div>
        <div style="color:var(--muted);font-size:13px;">Your account isn't linked to any company's pipeline yet.</div>
      </div>`;
    return;
  }

  orgIdx = Math.min(orgIdx, organizations.length - 1);
  const org = organizations[orgIdx];
  const companies = org.companies;

  document.getElementById('navClient').textContent = (organizations.length > 1 && org.name)
    ? `${user.name} · ${org.name}`
    : user.name;

  if (!companies.length) {
    document.title = 'TalentKnight';
    main.innerHTML = `
      <div class="centered" style="min-height:70vh;">
        <div style="font-size:36px;">📋</div>
        <div style="font-size:16px;font-weight:600;">No companies yet</div>
        <div style="color:var(--muted);font-size:13px;">${org.name ? esc(org.name) + ' has no companies yet.' : "Your account isn't linked to any company's pipeline yet."}</div>
      </div>`;
    return;
  }

  companyIdx = Math.min(companyIdx, companies.length - 1);
  const company = companies[companyIdx];
  const roles = company.roles;
  document.title = `${company.name} — TalentKnight`;

  if (!roles.length) {
    main.innerHTML = `
      <div class="app-layout">
        <aside class="sidebar">
          <div class="sidebar-top">${orgSelectHtml(organizations)}${companySelectHtml(companies)}${user.isStaff ? `<button class="client-record-link" onclick="openClientRecord()">🏢 View client record</button>` : ''}</div>
          <div class="role-list"><div class="role-list-empty">No roles yet</div></div>
          <button class="new-role-btn-sidebar" onclick="openRoleModal()">＋ New role</button>
          ${user.isStaff ? `<button class="earnings-toggle-btn" onclick="toggleEarningsView()">Forecast</button>` : ''}
          ${user.isStaff ? `<button class="earnings-toggle-btn" onclick="toggleAssistantView()">✨ AI Search</button>` : ''}
        </aside>
        <div class="content-area" id="contentArea">
          ${viewMode !== 'client' ? `
          <div class="centered" style="min-height:50vh;">
            <div style="font-size:36px;">📋</div>
            <div style="font-size:16px;font-weight:600;">No roles yet</div>
            <div style="color:var(--muted);font-size:13px;">Click <strong>＋ New role</strong> to request your first search.</div>
          </div>` : ''}
        </div>
      </div>`;
    attachCompanySelectListener();
    attachOrgSelectListener();
    if (viewMode === 'client' && user.isStaff) buildClientRecordView(company);
    return;
  }

  roleIdx = Math.min(roleIdx, roles.length - 1);
  const role = roles[roleIdx];

  main.innerHTML = `
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-top">${orgSelectHtml(organizations)}${companySelectHtml(companies)}${user.isStaff ? `<button class="client-record-link" onclick="openClientRecord()">🏢 View client record</button>` : ''}</div>
        <div class="sidebar-search">
          <input id="roleSearchInput" class="role-search-input" type="search" placeholder="Search roles…"
            oninput="onRoleSearch(this.value)" value="${esc(roleSearchQuery)}" autocomplete="off" />
        </div>
        <div class="role-list" id="roleList"></div>
        <label class="show-closed-toggle">
          <input type="checkbox" id="showClosedToggle" ${showClosed ? 'checked' : ''} onchange="toggleShowClosed(this.checked)" />
          Show closed roles
        </label>
        <button class="new-role-btn-sidebar" onclick="openRoleModal()">＋ New role</button>
        ${user.isStaff ? `<button class="earnings-toggle-btn" onclick="toggleEarningsView()">${viewMode === 'earnings' ? '← Back to pipeline' : 'Forecast'}</button>` : ''}
        ${user.isStaff ? `<button class="earnings-toggle-btn" onclick="toggleAssistantView()">${viewMode === 'assistant' ? '← Back to pipeline' : '✨ AI Search'}</button>` : ''}
      </aside>
      <div class="content-area" id="contentArea"></div>
    </div>`;

  attachCompanySelectListener();
  attachOrgSelectListener();
  buildRoleList();

  if (viewMode === 'earnings' && user.isStaff) {
    buildEarningsView(company);
  } else if (viewMode === 'assistant' && user.isStaff) {
    buildAssistantView();
  } else if (viewMode === 'client' && user.isStaff) {
    buildClientRecordView(company);
  } else {
    buildPipelineView(role);
  }
}

function openClientRecord() {
  viewMode = 'client';
  render();
}

function buildPipelineView(role) {
  const contentArea = document.getElementById('contentArea');
  // Each call rebuilds #rolePanel fresh (closed) — reset the tracker to match, otherwise a
  // panel left open on the previous role would make the next click on the same button
  // think it's already open and toggle it shut instead of loading the new role's data.
  openRolePanel = null;
  const hm = [role.hiringManagerName, role.hiringManagerEmail, role.hiringManagerPhone].some(Boolean);
  contentArea.innerHTML = `
    <div class="content-header">
      <div class="page-title">${esc(role.title)}</div>
      <div class="role-info">
        <span class="status-badge status-${role.status.toLowerCase()}">${esc(role.status)}</span>
        ${role.location ? `<span>📍 ${esc(role.location)}</span>` : ''}

        ${state.user.isStaff ? `<button class="role-icon-btn" onclick="toggleRolePanel('activity','${role.id}')">📋 Activity</button>` : ''}
        ${state.user.isStaff ? `<button class="role-icon-btn" onclick="toggleRolePanel('similar','${role.id}')">✨ Similar candidates</button>` : ''}

      </div>` : ''}

    </div>
    <div class="role-panel" id="rolePanel" style="display:none;"></div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>

      </div>

  updateSearchClear();
  buildKanban(role);
}

// ── Vacancy Dashboard panels: Activity + Similar candidates (2026-08-05) ────
// Both lazy-load on first open (no cost on every role view) and toggle closed on a second
// click of the same button. Kept as plain fetch-and-render rather than persisted state —
// these are advisory/read views, nothing here needs to survive a re-render.
let openRolePanel = null; // 'activity' | 'similar' | null
async function toggleRolePanel(kind, roleId) {
  const panel = document.getElementById('rolePanel');
  if (!panel) return;
  if (openRolePanel === kind) {
    openRolePanel = null;
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }
  openRolePanel = kind;
  panel.style.display = 'block';
  panel.innerHTML = `<div class="role-panel-loading">Loading…</div>`;
  try {
    const h = await authHeader();
    if (kind === 'activity') {
      const r = await fetch(`/api/crm?action=role-activity&roleId=${encodeURIComponent(roleId)}`, { headers: h });
      if (!r.ok) throw new Error();
      const data = await r.json();
      panel.innerHTML = renderRoleActivity(data.entries || []);
    } else {
      const r = await fetch(`/api/crm?action=similar-candidates&roleId=${encodeURIComponent(roleId)}`, { headers: h });
      if (!r.ok) throw new Error();
      const data = await r.json();
      panel.innerHTML = renderSimilarCandidates(data.results || []);
    }
  } catch {
    panel.innerHTML = `<div class="role-panel-loading">Failed to load — try again.</div>`;
  }
}

function renderRoleActivity(entries) {
  if (!entries.length) return `<div class="role-panel-empty">No activity logged against this role yet.</div>`;
  const rows = entries.map(e => {
    const when = new Date(e.loggedAt);
    const dateStr = isNaN(when) ? '' : when.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
      ' at ' + when.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="history-entry">
        <span class="history-type-badge">${esc(e.type)}</span><strong>${esc(e.candidateName)}</strong> — ${esc(e.summary)}
        <div class="history-meta">${esc(dateStr)}${e.loggedBy ? ` · ${esc(e.loggedBy)}` : ''}</div>
      </div>`;
  }).join('');
  return `<div class="role-panel-title">Activity across this role</div><div class="history-list">${rows}</div>`;
}

function renderSimilarCandidates(results) {
  if (!results.length) return `<div class="role-panel-empty">No strong suggestions right now — try Find matches for a fuller search.</div>`;
  const rows = results.map(c => `
    <div class="similar-cand-row">
      <div class="similar-cand-avatar" style="background:${avatarColor(c.name)}">${esc(initials(c.name))}</div>
      <div class="similar-cand-info">
        <div class="similar-cand-name">${esc(c.name)} <span class="similar-cand-score">${c.fitScore}</span></div>
        <div class="similar-cand-sub">${esc([c.role, shortLoc(c.location)].filter(Boolean).join(' · '))}</div>
        ${c.summary ? `<div class="similar-cand-summary">${esc(c.summary)}</div>` : ''}
      </div>
      ${c.linkedinUrl ? `<a class="similar-cand-linkedin" href="${escA(c.linkedinUrl)}" target="_blank" rel="noopener" title="LinkedIn">🔗</a>` : ''}
    </div>`).join('');
  return `<div class="role-panel-title">Similar live candidates (not yet on this board)</div>${rows}`;
}

function dealTermsHtml(role) {
  const feeDisplay = role.feePercent != null ? (role.feePercent * 100).toFixed(1) : '';
  const salaryDisplay = role.targetSalary != null ? role.targetSalary : '';
  const forecast = role.forecastValue != null ? `<span class="forecast-pill" title="Fee % × Salary — full potential if this role closes">Forecast: £${role.forecastValue.toLocaleString()}</span>` : '';
  return `
    <span class="deal-terms">
      Fee <input class="deal-input" id="dealFee" type="number" min="0" max="100" step="0.5" placeholder="—" value="${feeDisplay}"
        onchange="saveDealTerms('${role.id}')" />%
      · Salary <input class="deal-input salary" id="dealSalary" type="number" min="0" step="1000" placeholder="—" value="${salaryDisplay}"
        onchange="saveDealTerms('${role.id}')" /> £/yr
      <span class="deal-save-status" id="dealSaveStatus">✓ Saved</span>
    </span>
    ${forecast}`;
}

async function saveDealTerms(roleId) {
  const feeInput = document.getElementById('dealFee');
  const salaryInput = document.getElementById('dealSalary');
  const status = document.getElementById('dealSaveStatus');
  const feePercent = feeInput.value === '' ? null : Number(feeInput.value) / 100;
  const targetSalary = salaryInput.value === '' ? null : Number(salaryInput.value);
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=update-role-terms', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ roleId, feePercent, targetSalary }),
    });
    if (!r.ok) throw new Error();
    if (status) { status.style.opacity = '1'; setTimeout(() => { status.style.opacity = '0'; }, 2000); }
    await refreshDashboard();
  } catch {
    alert('Failed to save deal terms — please try again.');
  }
}

function toggleEarningsView() {
  viewMode = viewMode === 'earnings' ? 'pipeline' : 'earnings';
  render();
}

function toggleAssistantView() {
  viewMode = viewMode === 'assistant' ? 'pipeline' : 'assistant';

// ── AI Recruiter Assistant ──────────────────────────────────────────
// Free-text search across the whole candidate base (not scoped to a Role, unlike
// buildPipelineView's kanban). Query/results kept in module state so switching to
// Forecast and back doesn't lose the last search.
let assistantQuery = '';
let assistantResults = null; // null = no search run yet, [] = ran but zero results
let assistantSearching = false;

function buildAssistantView() {
  const contentArea = document.getElementById('contentArea');
  contentArea.innerHTML = `
    <div class="content-header">
      <div class="page-title">✨ AI Search</div>
      <div class="role-info" style="padding-bottom:14px;">
        <span style="color:var(--muted);font-size:12.5px;">Search your whole candidate base in plain English — not scoped to one role.</span>
      </div>
    </div>
    <div class="assistant-search-row">
      <input id="assistantInput" class="assistant-search-input" type="text"
        placeholder="e.g. Find someone similar to Holly but with payroll bureau experience"
        value="${esc(assistantQuery)}" autocomplete="off"
        onkeydown="if(event.key==='Enter') runAssistantSearch()" />
      <button class="assistant-search-btn" id="assistantSearchBtn" onclick="runAssistantSearch()">Search</button>
    </div>
    <div id="assistantResults">${assistantResultsHtml()}</div>`;

  setTimeout(() => document.getElementById('assistantInput')?.focus(), 50);
  attachAssistantCardListeners();
}

function assistantResultsHtml() {
  if (assistantSearching) return `<div class="assistant-empty">Searching…</div>`;
  if (assistantResults === null) return `<div class="assistant-empty">Try a query above — matches are scored and summarized the same way Find Matches works, just across every candidate instead of one role.</div>`;
  if (!assistantResults.length) return `<div class="assistant-empty">No strong matches for that query. Try different skills, a job title, or a location.</div>`;
  return `<div class="assistant-results-list">${assistantResults.map((c, i) => assistantCardHtml(c, i)).join('')}</div>`;
}

function assistantCardHtml(c, i) {
  const sub = [c.role, c.company].filter(Boolean).join(' · ');
  const loc = shortLoc(c.location);
  return `
    <div class="assistant-card" data-idx="${i}">
      <div class="cand-avatar" style="background:${avatarColor(c.name)}">${c.photoUrl ? `<img src="${escA(c.photoUrl)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">` : ''}${esc(initials(c.name))}</div>
      <div class="card-body">
        <div class="cand-name">${esc(c.name)}</div>
        ${sub ? `<div class="cand-sub">${esc(sub)}</div>` : ''}
        ${c.summary ? `<div class="cand-ai-summary">✨ ${esc(c.summary)}</div>` : ''}
        ${loc ? `<div class="card-loc" style="margin-top:4px;">📍 ${esc(loc)}</div>` : ''}
      </div>
      ${c.fitScore != null ? `<span class="fit-badge ${fitScoreClass(c.fitScore)}" title="AI fit score: ${fitScoreLabel(c.fitScore)}">${c.fitScore}</span>` : ''}
    </div>`;
}

// Event delegation via data-idx + a fresh listener pass, rather than embedding candidate
// JSON directly in an onclick attribute (fragile — quoting/escaping a full JSON blob into
// an HTML attribute is a needless source of bugs). Called after any innerHTML swap of
// #assistantResults.
function attachAssistantCardListeners() {
  document.querySelectorAll('.assistant-card').forEach(el => {
    el.addEventListener('click', () => {
      const c = assistantResults[Number(el.dataset.idx)];
      if (c) openDrawer(c, { roleContext: false });
    });
  });
}

async function runAssistantSearch() {
  const input = document.getElementById('assistantInput');
  const query = input.value.trim();
  if (!query) { input.focus(); return; }
  assistantQuery = query;
  assistantSearching = true;
  const btn = document.getElementById('assistantSearchBtn');
  btn.disabled = true; btn.textContent = 'Searching…';
  document.getElementById('assistantResults').innerHTML = assistantResultsHtml();
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=assistant-search', {
      method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    assistantResults = data.results || [];
  } catch {
    assistantResults = [];
  } finally {
    assistantSearching = false;
    btn.disabled = false; btn.textContent = 'Search';
    const resultsEl = document.getElementById('assistantResults');
    if (resultsEl) resultsEl.innerHTML = assistantResultsHtml();
    attachAssistantCardListeners();
  }
}

        ${c.mainContactTitle ? `<div style="font-size:12px;color:var(--muted);margin-top:1px;">${esc(c.mainContactTitle)}</div>` : ''}
        ${c.mainContactEmail ? `<div style="font-size:12px;color:var(--green);font-weight:500;margin-top:6px;">${esc(c.mainContactEmail)}</div>` : ''}
        ${c.mainContactPhone ? `<div style="font-size:12px;color:var(--text);margin-top:2px;">${esc(c.mainContactPhone)}</div>` : ''}
      </div>
      <div class="client-card">
        <div class="client-card-label">Terms agreed</div>

        ${since ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">Client since ${esc(since)}</div>` : ''}
      </div>

    <div class="client-section">

        const dot = { active: '#16a34a', paused: '#d97706', filled: '#2563eb', closed: '#94a3b8' }[r.status.toLowerCase()] || '#94a3b8';

          <span style="width:7px;height:7px;border-radius:50%;background:${dot};flex-shrink:0;"></span>
          <span style="font-size:13px;color:var(--text);flex:1;">${esc(r.title)}</span>

async function saveClientRecord() {
  if (!clientRecordData) return;
  const btn = document.getElementById('clientSaveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const updates = {
    website: document.getElementById('editWebsite').value.trim(),
    industry: document.getElementById('editIndustry').value.trim(),
    companySize: document.getElementById('editCompanySize').value.trim(),
    linkedinUrl: document.getElementById('editLinkedinUrl').value.trim(),
    officeLocations: document.getElementById('editOfficeLocations').value.trim(),
    feeTerms: document.getElementById('editFeeTerms').value.trim(),
    mainContactName: document.getElementById('editMainContactName').value.trim(),
    mainContactTitle: document.getElementById('editMainContactTitle').value.trim(),
    mainContactEmail: document.getElementById('editMainContactEmail').value.trim(),
    mainContactPhone: document.getElementById('editMainContactPhone').value.trim(),
    notes: document.getElementById('editNotes').value,
  };
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=update-company', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ companyId: clientRecordData.company.id, ...updates }),
    });
    if (!r.ok) throw new Error();
    Object.assign(clientRecordData.company, updates);
    clientEditMode = false;
    renderClientRecordBody();
  } catch {
    alert('Failed to save — please try again.');
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

function buildEarningsView(company) {
  const contentArea = document.getElementById('contentArea');
  const roles = company.roles;

  const forecastTotal = roles.reduce((sum, r) => sum + (r.forecastValue || 0), 0);
  const placedCandidates = roles.flatMap(r => (r.candidates || [])
    .filter(c => c.pipelineStage === 'Placed')
    .map(c => ({ ...c, roleTitle: r.title })));
  const actualTotal = placedCandidates.reduce((sum, c) => sum + (c.actualEarnings || 0), 0);
  const rolesWithTerms = roles.filter(r => r.feePercent != null || r.targetSalary != null).length;

  const roleRows = roles.map(r => {
    const stageLabel = (r.probability || 0) >= 1 ? 'Placed'
      : (r.candidates || []).length ? `${Math.round((r.probability || 0) * 100)}% likely` : 'No candidates yet';
    return `
      <tr>
        <td>${esc(r.title)}</td>
        <td class="num">${r.feePercent != null ? (r.feePercent * 100).toFixed(1) + '%' : '—'}</td>
        <td class="num">${r.targetSalary != null ? '£' + r.targetSalary.toLocaleString() : '—'}</td>
        <td>${esc(stageLabel)}</td>
        <td class="num">${r.forecastValue != null ? '£' + r.forecastValue.toLocaleString() : '—'}</td>
      </tr>`;
  }).join('');

  const placedRows = placedCandidates.map(c => `
    <tr>
      <td>${esc(c.name)}</td>
      <td>${esc(c.roleTitle)}</td>
      <td class="num">${c.placementSalary != null ? '£' + c.placementSalary.toLocaleString() : '—'}</td>
      <td class="num">${c.actualEarnings != null ? '£' + c.actualEarnings.toLocaleString() : '—'}</td>
    </tr>`).join('');

  contentArea.innerHTML = `
    <div class="content-header">
      <div class="page-title">Forecast — ${esc(company.name)}</div>
    </div>
    <div class="earnings-summary">
      <div class="earnings-card">
        <div class="earnings-card-label">Pipeline forecast</div>
        <div class="earnings-card-value">£${forecastTotal.toLocaleString()}</div>
        <div class="earnings-card-sub">Full potential, across ${roles.length} role${roles.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="earnings-card">
        <div class="earnings-card-label">Actual (billed)</div>
        <div class="earnings-card-value">£${actualTotal.toLocaleString()}</div>
        <div class="earnings-card-sub">${placedCandidates.length} placement${placedCandidates.length !== 1 ? 's' : ''}</div>

function buildRoleList() {
  const wrap = document.getElementById('roleList');
  if (!wrap) return;
  const company = currentCompany();
  const q = roleSearchQuery.toLowerCase().trim();
  const filtered = company.roles
    .map((r, i) => ({ r, i }))
    // Closed roles are hidden by default so old/duplicate roles don't clutter the list —
    // toggled via the "Show closed roles" checkbox. The currently-open role is always kept
    // visible even if closed, so editing its status doesn't yank it out from under you.
    .filter(({ r, i }) => showClosed || i === roleIdx || r.status.toLowerCase() !== 'closed')
    .filter(({ r }) => !q || r.title.toLowerCase().includes(q));

  if (!filtered.length) {
    wrap.innerHTML = `<div class="role-list-empty">No roles match "${esc(roleSearchQuery)}"</div>`;
    return;
  }

  const dotColor = { active: '#16a34a', paused: '#d97706', filled: '#2563eb', closed: '#94a3b8' };
  wrap.innerHTML = '';
  filtered.forEach(({ r, i }) => {
    const item = document.createElement('div');
    item.className = 'role-item' + (i === roleIdx ? ' active' : '');
    item.innerHTML = `
      <div class="role-item-top">
        <span class="role-item-dot" style="background:${dotColor[r.status.toLowerCase()] || '#94a3b8'}"></span>
        <span class="role-item-title">${esc(r.title)}</span>
      </div>
      <div class="role-item-meta">${r.candidates.length} candidate${r.candidates.length !== 1 ? 's' : ''}${r.location ? ` · ${esc(shortLoc(r.location))}` : ''}</div>`;
    item.onclick = () => { roleIdx = i; searchQuery = ''; viewMode = 'pipeline'; closeDrawer(); render(); };
    wrap.appendChild(item);
  });
}

// ── Search ──────────────────────────────────────────────
function onSearch(val) {
  searchQuery = val;
  updateSearchClear();

  buildKanban(role);
  updateSearchCount(role);
}

function clearSearch() {
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if (input) { input.value = ''; input.focus(); }
  updateSearchClear();
  const role = currentCompany().roles[roleIdx];
  buildKanban(role);
  updateSearchCount(role);
}

function updateSearchClear() {
  const el = document.getElementById('searchClear');
  if (el) el.style.display = searchQuery ? 'block' : 'none';
}

function updateSearchCount(role) {
  const el = document.getElementById('searchCount');
  if (!el) return;
  const q = searchQuery.toLowerCase().trim();
  if (!q) { el.textContent = ''; return; }
  const matched = filterCandidates(role.candidates).length;
  el.textContent = `${matched} of ${role.candidates.length} candidate${role.candidates.length !== 1 ? 's' : ''}`;
}

function filterCandidates(candidates) {
  const q = searchQuery.toLowerCase().trim();
  if (!q) return candidates;
  return candidates.filter(c =>
    [c.name, c.role, c.company, shortLoc(c.location)].some(v => v?.toLowerCase().includes(q))
  );
}

// ── Kanban ──────────────────────────────────────────────
function buildKanban(role) {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const visible = filterCandidates(role.candidates);
  const byStage = {};
  STAGES.forEach(s => byStage[s] = []);
  byStage.Sourced = byStage.Sourced || [];
  visible.forEach(c => { byStage[STAGES.includes(c.pipelineStage) ? c.pipelineStage : 'Sourced'].push(c); });

  STAGES.forEach(stage => {
    const cfg = STAGE_CFG[stage];
    const cards = byStage[stage];
    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.innerHTML = `
      <div class="col-header">
        <span class="stage-dot" style="background:${cfg.dot}"></span>
        <span class="stage-name" style="color:${cfg.color}">${stage}</span>
        <span class="stage-count">${cards.length}</span>
      </div>
      <div class="col-body" data-stage="${stage}"></div>`;

    const body = col.querySelector('.col-body');
    if (!cards.length) {
      body.innerHTML = `<div class="col-empty">${searchQuery ? 'No match' : 'Drop here'}</div>`;
    } else {
      cards.forEach(c => body.appendChild(makeCard(c)));
    }

    if (!searchQuery) {
      body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
      body.addEventListener('dragleave', e => { if (!body.contains(e.relatedTarget)) body.classList.remove('drag-over'); });
      body.addEventListener('drop', e => {
        e.preventDefault(); body.classList.remove('drag-over');
        if (dragId && dragFrom && dragFrom !== stage) applyStage(dragId, stage, dragFrom);
      });
    }
    board.appendChild(col);
  });
}

function makeCard(c) {
  const card = document.createElement('div');
  card.className = 'cand-card';
  card.draggable = !searchQuery;
  const sub = [c.role, c.company].filter(Boolean).join(' · ');
  const loc = shortLoc(c.location);
  const age = stageDays(c.stageChangedAt);

  const q = searchQuery.toLowerCase().trim();
  const hl = (s) => {
    if (!q || !s) return esc(s || '');
    const idx = s.toLowerCase().indexOf(q);
    if (idx === -1) return esc(s);
    return esc(s.slice(0, idx)) + `<mark style="background:#fef08a;border-radius:2px;padding:0 1px">${esc(s.slice(idx, idx + q.length))}</mark>` + esc(s.slice(idx + q.length));
  };

  const ageBadge = age !== null
    ? `<span class="stage-age ${ageClass(age)}" title="${age === 0 ? 'Moved today' : `${age} day${age !== 1 ? 's' : ''} in this stage`}">${age === 0 ? 'today' : age + 'd'}</span>`
    : '';

  card.innerHTML = `
    <div class="card-top">
      <div class="cand-avatar" style="background:${avatarColor(c.name)}">${c.photoUrl ? `<img src="${escA(c.photoUrl)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.remove()">` : ''}${esc(initials(c.name))}</div>
      <div class="card-body">
        <div class="cand-name" title="${esc(c.name)}">${hl(c.name)}</div>
        ${sub ? `<div class="cand-sub" title="${esc(sub)}">${hl(sub)}</div>` : ''}
        ${c.summary ? `<div class="cand-ai-summary" title="${esc(c.summary)}">✨ ${hl(c.summary)}</div>` : ''}
      </div>
      ${c.fitScore != null ? `<span class="fit-badge ${fitScoreClass(c.fitScore)}" title="AI fit score: ${fitScoreLabel(c.fitScore)}">${c.fitScore}</span>` : ''}
    </div>
    <div class="card-footer">
      <span class="card-loc">${loc ? `📍 ${hl(loc)}` : ''}</span>
      ${ageBadge}
      <div class="card-icons">
        <span class="consent-dot${c.email ? ' ok' : ''}" title="${c.email ? 'Email available' : 'Pending consent'}"></span>
        ${c.linkedinUrl ? `<a class="li-btn" href="${escA(c.linkedinUrl)}" target="_blank" title="View on LinkedIn" onclick="event.stopPropagation()">in</a>` : ''}
      </div>
    </div>`;

  card.addEventListener('click', () => openDrawer(c));
  if (!searchQuery) {
    card.addEventListener('dragstart', e => {
      dragId = c.id; dragFrom = c.pipelineStage || 'Sourced';
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.col-body').forEach(b => b.classList.remove('drag-over'));
    });
  }
  return card;
}

// ── Stage update ────────────────────────────────────────────────────
async function applyStage(candidateId, newStage, oldStage) {
  const role = currentCompany().roles[roleIdx];
  const cand = role.candidates.find(c => c.id === candidateId);
  if (cand) { cand.pipelineStage = newStage; cand.stageChangedAt = todayISO(); }
  buildKanban(role);
  try {
    const h = await authHeader();
    // roleId is required now — Pipeline Stage lives on a per-(candidate, role) Role
    // Matches row server-side, not a flat field on the candidate, so the API needs to
    // know which Role's row to update (a candidate can be matched to more than one).
    const r = await fetch('/api/crm?action=update-stage', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ candidateId, roleId: role.id, stage: newStage }),
    });
    if (!r.ok) throw new Error();
  } catch {
    if (cand) { cand.pipelineStage = oldStage; cand.stageChangedAt = cand._prevStageChangedAt; }
    buildKanban(role);
    alert('Stage update failed — please try again.');
  }
}

// ── Find matches (Vesper, scoped to a Role) ────────────────────────────
// Same instant-pool + Claude-ranking + live-Apify-top-up pattern the public Vesper search
// on demo.html uses, pointed at this Role's brief. Results land straight in the Matched
// column via api/crm.js's find-matches / find-matches-poll actions.
async function findMatches(roleId) {
  const btn = document.getElementById('findMatchesBtn');
  const status = document.getElementById('findMatchesStatus');
  if (!btn) return;
  btn.disabled = true; btn.textContent = '🔍 Searching…';
  if (status) status.textContent = '';
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=find-matches', {
      method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ roleId }),
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (status) status.textContent = `${data.matchedCount} matched from pool`;
    if (data.matchedCount) await refreshDashboard();
    if (data.runId) {
      btn.textContent = '🔍 Live search…';
      pollFindMatches(data.runId, roleId, 0);
    } else {
      btn.disabled = false; btn.textContent = '🔍 Find matches';
    }
  } catch {
    if (status) status.textContent = 'Search failed';
    btn.disabled = false; btn.textContent = '🔍 Find matches';
  }
}

function pollFindMatches(runId, roleId, attempt, retry) {
  if (attempt >= 20) {
    const btn = document.getElementById('findMatchesBtn');
    const status = document.getElementById('findMatchesStatus');
    if (btn) { btn.disabled = false; btn.textContent = '🔍 Find matches'; }
    if (status) status.textContent = 'Live search timed out';
    return;
  }
  setTimeout(async () => {
    const btn = document.getElementById('findMatchesBtn');
    const status = document.getElementById('findMatchesStatus');
    try {
      const h = await authHeader();
      // retry flag/runId round-trip: the backend can swap in a fresh runId mid-poll (see
      // find-matches-poll's location-not-recognized fallback, added 2026-08-04) — a broader,
      // no-location re-search kicked off automatically when the first pass 404s on an
      // unrecognized small-town Location. We just need to keep following whatever runId/retry
      // the server hands back rather than assuming the original runId stays valid throughout.
      const retryQs = retry ? `&retry=${encodeURIComponent(retry)}` : '';
      const r = await fetch(`/api/crm?action=find-matches-poll&runId=${encodeURIComponent(runId)}&roleId=${encodeURIComponent(roleId)}${retryQs}`, { headers: h });
      const data = await r.json();
      if (data.status === 'RUNNING') return pollFindMatches(data.runId || runId, roleId, attempt + 1, data.retry || retry);
      if (btn) { btn.disabled = false; btn.textContent = '🔍 Find matches'; }
      if (data.status === 'SUCCEEDED') {
        if (status) status.textContent = data.matchedCount ? `+${data.matchedCount} more from live search` : 'No new live matches';
        if (data.matchedCount) await refreshDashboard();
      } else if (status) {
        status.textContent = 'Live search unavailable';
      }
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = '🔍 Find matches'; }
      if (status) status.textContent = 'Live search failed';
    }
  }, 3000);
}

async function refreshDashboard() {
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=dashboard', { headers: h });
    if (!r.ok) return;
    state = await r.json();
    render();
  } catch { /* keep showing existing state if refresh fails */ }
}
