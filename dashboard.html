  // Save button entirely when there's no role in context (AI Search drawer opens), rather
  // than leaving a button that would either no-op or throw on a missing #drawerNotes.
  const footer = document.querySelector('.drawer-footer');
  if (footer) footer.style.display = hasRoleContext ? '' : 'none';

  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('saveStatus').style.opacity = '0';

  if (state.user.isStaff) loadCandidateHistory(c.id);
}

// ── CRM Intelligence (Contact History) ─────────────────────────────
function renderHistoryEntries(entries) {
  const list = document.getElementById('historyList');
  if (!list) return; // drawer may have been closed/reopened before the fetch resolved
  if (!entries.length) {
    list.innerHTML = `<div class="history-empty">No activity logged yet.</div>`;
    return;
  }
  list.innerHTML = entries.map(e => {
    const when = new Date(e.loggedAt);
    const dateStr = isNaN(when) ? '' : when.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
      ' at ' + when.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="history-entry">
        <span class="history-type-badge">${esc(e.type)}</span>${esc(e.summary)}
        <div class="history-meta">${esc(dateStr)}${e.loggedBy ? ` · ${esc(e.loggedBy)}` : ''}</div>
      </div>`;
  }).join('');
}

async function loadCandidateHistory(candidateId) {
  try {
    const h = await authHeader();
    const r = await fetch(`/api/crm?action=candidate-history&candidateId=${encodeURIComponent(candidateId)}`, { headers: h });
    if (!r.ok) throw new Error();
    const data = await r.json();
    // Guard against a stale response landing after the drawer moved on to a different
    // candidate (fast clicking between cards) or closed entirely.
    if (openCand?.id !== candidateId) return;
    renderHistoryEntries(data.entries || []);
  } catch {
    const list = document.getElementById('historyList');
    if (list && openCand?.id === candidateId) list.innerHTML = `<div class="history-empty">Couldn't load activity.</div>`;
  }
}

async function addHistoryEntry(candidateId) {
  const type = document.getElementById('historyType').value;
  const input = document.getElementById('historySummary');
  const summary = input.value.trim();
  if (!summary) { input.focus(); return; }
  const btn = document.getElementById('historyLogBtn');
  btn.disabled = true; btn.textContent = 'Logging…';
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=add-history', {
      method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ candidateId, roleId: openCandRoleId, type, summary }),
    });
    if (!r.ok) throw new Error();
    input.value = '';
    await loadCandidateHistory(candidateId);
  } catch {
    alert('Failed to log entry — please try again.');
  } finally {
    btn.disabled = false; btn.textContent = 'Log';
  }
}

function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  openCand = null;
}

async function drawerChangeStage(sel) {
  if (!openCand) return;
  const newStage = sel.value;
  const oldStage = openCand.pipelineStage;
  if (newStage === oldStage) return;
  openCand._prevStageChangedAt = openCand.stageChangedAt;
  await applyStage(openCand.id, newStage, oldStage);
  const since = document.querySelector('.stage-since');
  if (since) {
    since.className = 'stage-since stage-since-ok';
    since.textContent = '⏱ Moved to this stage today';
  }
}

async function saveNotes() {
  // Notes are role-scoped (Role Matches row for this candidate+role), not a flat
  // Candidate field — see api/crm.js's RMF comment for why. The footer button is hidden
  // whenever the drawer has no role in context (openDrawer), but guard here too in case
  // this is ever reachable another way.
  if (!openCand || !openCandRoleId) return;
  const notesEl = document.getElementById('drawerNotes');
  if (!notesEl) return;
  const notes = notesEl.value;
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=save-notes', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ candidateId: openCand.id, roleId: openCandRoleId, notes }),
    });
    if (!r.ok) throw new Error();
    openCand.notes = notes;
    status.style.opacity = '1';
    setTimeout(() => { status.style.opacity = '0'; }, 2500);
  } catch { alert('Failed to save notes — please try again.'); }
  finally { btn.disabled = false; btn.textContent = 'Save notes'; }
}

async function savePlacementSalary(candidateId) {
  // Role-scoped, same reasoning as saveNotes() above — this field is only ever rendered
  // when hasRoleContext is true, so openCandRoleId is guaranteed set here.
  const input = document.getElementById('drawerPlacementSalary');
  const status = document.getElementById('placementSaveStatus');
  const placementSalary = input.value === '' ? null : Number(input.value);
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=save-placement-salary', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ candidateId, roleId: openCandRoleId, placementSalary }),
    });
    if (!r.ok) throw new Error();

    // Update local state in place (mirrors applyStage's approach) rather than a full
    // server refetch — recomputes actualEarnings using the same formula the backend
    // uses (Fee % × placement salary, falling back to Target Salary), so the kanban
    // board and Earnings view reflect the change immediately without a round trip.
    const role = currentCompany().roles.find(r => r.candidates.some(c => c.id === candidateId));
    const cand = role?.candidates.find(c => c.id === candidateId);
    if (cand) {
      cand.placementSalary = placementSalary;
      const salaryForCalc = placementSalary ?? role.targetSalary ?? null;
      cand.actualEarnings = (role.feePercent && salaryForCalc) ? Math.round(role.feePercent * salaryForCalc) : null;
      if (openCand && openCand.id === candidateId) openCand.actualEarnings = cand.actualEarnings;
    }

    if (status) { status.style.opacity = '1'; setTimeout(() => { status.style.opacity = '0'; }, 2000); }
    const earningsNote = document.getElementById('placementEarningsNote');
    if (earningsNote) {
      earningsNote.innerHTML = cand?.actualEarnings != null ? `Actual earnings at this rate: <strong>£${cand.actualEarnings.toLocaleString()}</strong>` : '';
    }
  } catch {
    alert('Failed to save placement salary — please try again.');
  }
}

// ── Role modal ─────────────────────────────────────────────────────
// Two-phase submit (added 2026-08-05, wiring up the clarify-brief backend action that
// already existed in api/crm.js but was never called from here — see roadmap notes).
// First click checks with Claude whether the brief is missing anything worth asking
// about (must-have vs nice-to-have, seniority, remote/hybrid/onsite, salary range,
// sector specifics). If nothing's missing, clarify-brief returns [] and the role is
// created immediately — no extra step for a brief that's already detailed. If there
// are questions, they're rendered inline and the button becomes "Continue"; the second
// click appends any answers to the brief text (skipped answers are just omitted) and
// creates the role as before.
let pendingClarifyQuestions = [];

function openRoleModal() {
  document.getElementById('roleTitle').value = '';
  document.getElementById('roleLocation').value = '';
  document.getElementById('roleBrief').value = '';
  document.getElementById('roleClarifyQuestions').innerHTML = '';
  pendingClarifyQuestions = [];
  document.getElementById('roleSubmitBtn').disabled = false;
  document.getElementById('roleSubmitBtn').textContent = 'Submit role';
  document.getElementById('roleModalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('roleTitle').focus(), 50);
}

function closeRoleModal(e) {
  if (e && e.target !== document.getElementById('roleModalOverlay')) return;
  document.getElementById('roleModalOverlay').classList.remove('open');
}

function renderClarifyQuestions(questions) {
  const wrap = document.getElementById('roleClarifyQuestions');
  wrap.innerHTML = `<div style="font-size:12px;color:var(--muted);margin:2px 0 4px;">A couple of quick questions to sharpen this brief before we search — leave any blank to skip.</div>` +
    questions.map((q, i) => `
      <div class="modal-field">
        <label>${esc(q)}</label>
        <input id="clarifyAnswer${i}" class="modal-input" type="text" />
      </div>`).join('');
}

async function submitNewRole() {
  const title = document.getElementById('roleTitle').value.trim();
  if (!title) { document.getElementById('roleTitle').focus(); return; }
  const location = document.getElementById('roleLocation').value.trim();
  let brief = document.getElementById('roleBrief').value.trim();
  const btn = document.getElementById('roleSubmitBtn');

  if (!pendingClarifyQuestions.length) {
    btn.disabled = true; btn.textContent = 'Checking brief…';
    try {
      const h = await authHeader();
      const r = await fetch('/api/crm?action=clarify-brief', {
        method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, location, brief }),
      });
      if (r.ok) {
        const data = await r.json();
        if (data.questions?.length) {
          pendingClarifyQuestions = data.questions;
          renderClarifyQuestions(pendingClarifyQuestions);
          btn.disabled = false; btn.textContent = 'Continue';
          return;
        }
      }
    } catch { /* best-effort — fall through and create the role on the original brief */ }
  }

  const answered = pendingClarifyQuestions
    .map((q, i) => document.getElementById(`clarifyAnswer${i}`)?.value.trim())
    .filter(Boolean);
  if (answered.length) brief = [brief, ...answered].filter(Boolean).join(' — ');

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const companyId = currentCompany().id;
    const h = await authHeader();
    const r = await fetch('/api/crm?action=create-role', {
      method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ companyId, title, location, brief }),
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    const company = currentCompany();
    company.roles.push({ id: data.roleId, title, location, brief, status: 'Active', candidates: [] });
    roleIdx = company.roles.length - 1;
    searchQuery = '';
    roleSearchQuery = '';
    pendingClarifyQuestions = [];
    document.getElementById('roleModalOverlay').classList.remove('open');
    render();
  } catch {
    alert('Failed to create role — please try again.');
    btn.disabled = false; btn.textContent = 'Submit role';
  }
}

function toggleShowClosed(checked) {
  showClosed = checked;
  buildRoleList();
}

// ── Edit / delete role ─────────────────────────────────────
// Added 2026-08-04 — previously the only role write was create-role (plus update-role-terms
// for Fee%/Target Salary), so a typo or an accidental duplicate role (see the Bookkeeping/
// Client Bookkeeper duplicate found this session) had no fix short of editing Airtable
// directly. Backed by the new update-role / delete-role actions in api/crm.js.
function openEditRoleModal(roleId) {
  const company = currentCompany();
  const role = company.roles.find(r => r.id === roleId);
  if (!role) return;
  editingRoleId = roleId;
  document.getElementById('editRoleTitle').value = role.title;
  document.getElementById('editRoleLocation').value = role.location || '';
  document.getElementById('editRoleBrief').value = role.brief || '';
  document.getElementById('editRoleStatus').value = role.status;
  document.getElementById('editRoleHMName').value = role.hiringManagerName || '';
  document.getElementById('editRoleHMEmail').value = role.hiringManagerEmail || '';
  document.getElementById('editRoleHMPhone').value = role.hiringManagerPhone || '';
  document.getElementById('editRoleNotes').value = role.roleNotes || '';
  document.getElementById('editRoleSubmitBtn').disabled = false;
  document.getElementById('editRoleSubmitBtn').textContent = 'Save changes';
  document.getElementById('editRoleModalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('editRoleTitle').focus(), 50);
}

function closeEditRoleModal(e) {
  if (e && e.target !== document.getElementById('editRoleModalOverlay')) return;
  document.getElementById('editRoleModalOverlay').classList.remove('open');
  editingRoleId = null;
}

async function submitEditRole() {
  if (!editingRoleId) return;
  const title = document.getElementById('editRoleTitle').value.trim();
  if (!title) { document.getElementById('editRoleTitle').focus(); return; }
  const location = document.getElementById('editRoleLocation').value.trim();
  const brief = document.getElementById('editRoleBrief').value.trim();
  const status = document.getElementById('editRoleStatus').value;
  const hiringManagerName = document.getElementById('editRoleHMName').value.trim();
  const hiringManagerEmail = document.getElementById('editRoleHMEmail').value.trim();
  const hiringManagerPhone = document.getElementById('editRoleHMPhone').value.trim();
  const roleNotes = document.getElementById('editRoleNotes').value.trim();
  const btn = document.getElementById('editRoleSubmitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=update-role', {
      method: 'PATCH', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ roleId: editingRoleId, title, location, brief, status, hiringManagerName, hiringManagerEmail, hiringManagerPhone, roleNotes }),
    });
    if (!r.ok) throw new Error();
    const company = currentCompany();
    const role = company.roles.find(r => r.id === editingRoleId);
    if (role) Object.assign(role, { title, location, brief, status, hiringManagerName, hiringManagerEmail, hiringManagerPhone, roleNotes });
    document.getElementById('editRoleModalOverlay').classList.remove('open');
    editingRoleId = null;
    render();
  } catch {
    alert('Failed to save role — please try again.');
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

async function confirmDeleteRole() {
  if (!editingRoleId) return;
  const company = currentCompany();
  const role = company.roles.find(r => r.id === editingRoleId);
  if (!role) return;
  const candCount = role.candidates.length;
  const warning = candCount
    ? `Delete "${role.title}"? This also permanently removes ${candCount} candidate match${candCount !== 1 ? 'es' : ''} linked to this role (the candidates themselves are untouched). This can't be undone.`
    : `Delete "${role.title}"? This can't be undone.`;
  if (!confirm(warning)) return;

  const btn = document.getElementById('editRoleDeleteBtn');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try {
    const h = await authHeader();
    const r = await fetch('/api/crm?action=delete-role', {
      method: 'POST', headers: { ...h, 'Content-Type': 'application/json' },
      body: JSON.stringify({ roleId: editingRoleId }),
    });
    if (!r.ok) throw new Error();
    company.roles = company.roles.filter(r => r.id !== editingRoleId);
    roleIdx = Math.min(roleIdx, Math.max(0, company.roles.length - 1));
    document.getElementById('editRoleModalOverlay').classList.remove('open');
    editingRoleId = null;
    searchQuery = '';
    render();
  } catch {
    alert('Failed to delete role — please try again.');
    btn.disabled = false; btn.textContent = '🗑️ Delete role';
  }
}

// ── Helpers ───────────────────────────────────────────────
function stageDays(dateStr) {
  if (!dateStr) return null;
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diff = Math.floor((now - then) / 86400000);
  return diff < 0 ? 0 : diff;
}

function ageClass(days) {
  if (days >= 14) return 'stage-age-alert';
  if (days >= 7)  return 'stage-age-warn';
  return 'stage-age-ok';
}

function todayISO() {
  return new Date().toISOString().split('T')[0];
}

function avatarColor(name) {
  const p = ['#2563eb','#7c3aed','#db2777','#dc2626','#d97706','#059669','#0891b2','#4f46e5'];
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) & 0x7fffffff;
  return p[h % p.length];
}
function initials(name) {
  return String(name || '').split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
}
// Four-tier bands (2026-08-05) — 90+ Excellent, 80-89 Strong, 70-79 Good, below 70
// Partial. Class name doubles as the human label (see fitScoreLabel below), replacing
// the previous two-cutoff good/ok/low scheme (85/70) that didn't match this spec.
function fitScoreClass(score) {
  return score >= 90 ? 'excellent' : score >= 80 ? 'strong' : score >= 70 ? 'good' : 'partial';
}
function fitScoreLabel(score) {
  const c = fitScoreClass(score);
  return c.charAt(0).toUpperCase() + c.slice(1);
}
function shortLoc(loc) {
  if (!loc) return '';
  const parts = loc.split(',').map(p => p.trim());
  if (parts.length === 1) return loc;
  const cm = { 'United Kingdom':'UK','England':'UK','Scotland':'UK','Wales':'UK','Northern Ireland':'UK','United States':'US','United States of America':'US' };
  return `${parts[0]}, ${cm[parts[parts.length-1]] ?? parts[parts.length-1]}`;
}
function formatSalary(min, max) {
  const fmt = (n) => `£${Math.round(n / 1000)}k`;
  if (min != null && max != null) return `${fmt(min)} – ${fmt(max)}`;
  if (min != null) return `${fmt(min)}+`;
  if (max != null) return `Up to ${fmt(max)}`;
  return '';
}
function esc(s)  { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s ?? '').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showErr(t, m) {
  document.getElementById('main').innerHTML = `<div class="centered"><div class="err-title">${esc(t)}</div><div class="err-msg">${esc(m)}</div></div>`;
}

window.addEventListener('load', load);
</script>
