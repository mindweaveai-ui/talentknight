<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentKnight — Client Portal Has Moved</title>
<meta http-equiv="refresh" content="0; url=/dashboard">
<link rel="canonical" href="https://www.talentknight.ai/dashboard" />
<style>
:root{--bg:#ffffff;--text:#0f172a;--text-muted:#64748b;--accent:#2563eb;--sans:"Inter",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
.card{max-width:420px;}
.logo{font-size:22px;font-weight:700;margin-bottom:20px;}
.logo span{color:var(--accent);}
h1{font-size:22px;font-weight:700;margin-bottom:12px;}
p{color:var(--text-muted);font-size:15px;line-height:1.6;margin-bottom:24px;}
a.btn{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:12px 24px;border-radius:999px;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Talent<span>Knight</span></div>
  <h1>This portal has moved</h1>
  <p>The client portal is now part of the TalentKnight dashboard. You'll be redirected automatically, or click below.</p>
  <a class="btn" href="/dashboard">Go to dashboard</a>
</div>
</body>
</html>
